spring:
  application:
    name: JobSwiperBackend
  datasource:
    url: jdbc:h2:file:./data/jobswiper
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:jobswiper-local-development-secret-change-me-2026}
  expiration: 28800000

app:
  cors:
    allowed-origins:
      - http://localhost:8081
      - http://127.0.0.1:8081
  admin:
    username: ${ADMIN_USERNAME:}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
