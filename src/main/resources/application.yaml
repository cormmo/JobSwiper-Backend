spring:
  application:
    name: JobSwiperBackend
    datasource:
      url: jdbc:h2:mem:jobswiperbackend;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      driver-class-name: org.h2.Driver
      username: sa
      password:
  h2:
    console:
      enabled: true
      path: /h2-console
jpa:
  hibernate:
    ddl-auto: update
  open-in-view: false
  defer-datasource-initialization: true
  properties:
    hibernate:
      jdbc:
        time_zone: UTC
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always

server:
  port: 8081
  servlet:
    session:
      timeout: 2d